name: CI

on:
  push:
    branches: [main, laravel]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes em PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 8.3 é o mínimo do Laravel 13; a mais nova pega depreciações cedo.
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, openssl, fileinfo, zip
          coverage: none

      - name: Dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # PSR-12, configurado em pint.json. --test só confere, não altera.
      - name: Estilo
        run: ./vendor/bin/pint --test

      # Os testes de domínio não tocam em banco; os de feature usam SQLite
      # em memória, configurado no phpunit.xml. Nada a preparar além disto.
      - name: Testes
        run: php artisan test
